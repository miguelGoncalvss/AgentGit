name: AgGit CI

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  test-matrix:
    name: Build & Test (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12" ]
        rust-version: [ stable ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: Configure Git for Testing
        run: |
          git config --global user.name "AgGit CI"
          git config --global user.email "ci@aggit.local"
          git config --global init.defaultBranch main

      - name: Run Python Complete Test Suite
        timeout-minutes: 10
        run: |
          python -m unittest discover -s tests -v

      - name: Build Rust Engine (Locked)
        working-directory: ./aggit-rs
        timeout-minutes: 10
        run: |
          cargo build --release --locked

      - name: Run Rust Integration Tests (Locked)
        working-directory: ./aggit-rs
        timeout-minutes: 10
        run: |
          cargo test --verbose --locked

      - name: Run Multi-Agent Benchmark Smoke Test
        timeout-minutes: 10
        run: |
          python benchmark.py
