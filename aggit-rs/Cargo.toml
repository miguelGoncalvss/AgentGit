[package]
name = "aggit"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
flate2 = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
memmap2 = "0.9"
rayon = "1.10"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "fast-rng"] }
chrono = { version = "0.4", features = ["serde"] }
